<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validação de Certificado</title><style>body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f5f8f6;color:#111827}.wrap{max-width:760px;margin:50px auto;padding:20px}.card{background:white;border:1px solid #dfe8e2;border-radius:24px;padding:28px;box-shadow:0 18px 50px rgba(0,0,0,.08)}.badge{display:inline-block;padding:7px 10px;border-radius:999px;background:#eaffE6;color:#128b29;font-weight:800;font-size:11px}.ok{font-size:46px;margin:12px 0}.grid{display:grid;gap:10px;margin:20px 0}.row{padding:12px;border-radius:12px;background:#f7faf8;border:1px solid #e5ece7}.row small,.row b{display:block}.row small{font-size:9px;color:#6b7a72;letter-spacing:.12em}.row b{margin-top:4px}.note{font-size:11px;color:#607067;line-height:1.55;margin-top:18px}.warn{background:#fff8e8;border-color:#f3d28a}</style></head><body><div class="wrap"><div class="card" id="card"></div></div><script>
const q=new URLSearchParams(location.search),code=q.get('codigo')||'',hash=q.get('h')||'',name=q.get('n')||'',course=q.get('c')||'',date=q.get('d')||'';
const card=document.getElementById('card');
function br(iso){if(!iso)return '—';const [y,m,d]=iso.split('-');return `${d}/${m}/${y}`}
if(!code){card.innerHTML='<span class="badge">CONSULTA</span><div class="ok">⌁</div><h1>Código não informado</h1><p>Abra esta página a partir do QR ou informe o código de certificado.</p>'}
else{card.innerHTML=`<span class="badge">CERTIFICADO CONSULTADO</span><div class="ok">✓</div><h1>${code}</h1><div class="grid"><div class="row"><small>ALUNO(A)</small><b>${name||'Não informado'}</b></div><div class="row"><small>FORMAÇÃO</small><b>${course||'Projetos de Infraestrutura de Recarga Veicular'}</b></div><div class="row"><small>CONCLUSÃO</small><b>${br(date)}</b></div><div class="row"><small>REGISTRO</small><b>${hash?hash.slice(0,10).toUpperCase():'—'}</b></div></div><div class="row warn"><b>Modo local da V5</b><span class="note">Esta página exibe os dados codificados no QR. Para validação pública antifraude em qualquer dispositivo, conecte a plataforma ao banco Supabase incluído no pacote. A estrutura do backend já está preparada.</span></div>`}
</script></body></html>
