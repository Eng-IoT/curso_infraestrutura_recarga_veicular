x="145" y="585" width="1100" height="110" rx="16" class="note"/><text x="170" y="615" class="label">Manual ABB</text><text x="170" y="645" class="small">Para EVSE 32 A: proteção de sobrecorrente 40 A, característica C; RCD no mínimo Tipo A, corrente residual nominal máx. 30 mA.</text><text x="170" y="675" class="tiny">O Terra AC monitora internamente corrente de falha CC acima de 6 mA. Confirmar a versão do equipamento.</text><rect x="55" y="730" width="1290" height="44" rx="12" class="warn"/><text x="75" y="758" class="small">⚠ O manual ABB admite RCD Tipo A + MCB ou RCBO Tipo A mínimo. Diagrama aqui é uma interpretação didática da arquitetura upstream.</text></svg>