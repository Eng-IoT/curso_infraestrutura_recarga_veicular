</style><rect width="1400" height="820" fill="#ffffff"/><rect x="25" y="25" width="1350" height="770" rx="24" fill="#fff" stroke="#dbeafe" stroke-width="2"/><rect x="25" y="25" width="12" height="110" fill="#39ff14"/><text x="60" y="75" class="title">Esquema 06 — Quadro elétrico dedicado ao carregador</text><text x="60" y="110" class="sub">Como ligar disjuntor, DR, DPS, barramento N e barramento PE</text><rect x="70" y="160" width="900" height="500" rx="22" class="panel"/><text x="95" y="195" class="label">QD-SAVE — exemplo L+N+PE</text><rect x="145" y="255" width="190" height="250" rx="16" class="device"/><text x="240.0" y="291" class="label" text-anchor="middle">DISJUNTOR</text><text x="240.0" y="320" class="small" text-anchor="middle">proteção contra</text><text x="240.0" y="344" class="small" text-anchor="middle">sobrecorrente</text><rect x="440" y="255" width="190" height="250" rx="16" class="device"/><text x="535.0" y="291" class="label" text-anchor="middle">DR</text><text x="535.0" y="320" class="small" text-anchor="middle">proteção</text><text x="535.0" y="344" class="small" text-anchor="middle">diferencial</text><rect x="720" y="400" width="180" height="150" rx="16" class="device"/><text x="810.0" y="436" class="label" text-anchor="middle">DPS</text><text x="810.0" y="465" class="small" text-anchor="middle">em derivação</text><text x="810.0" y="489" class="small" text-anchor="middle">não em série</text><path class="L" d="M85 315 L145 315"/><path class="L" d="M335 315 L440 315"/><path class="L" d="M630 315 L950 315"/><path class="N" d="M85 385 L145 385"/><path class="N" d="M335 385 L440 385"/><path class="N" d="M630 385 L950 385"/><path class="PE" d="M85 590 L950 590"/><path class="L" d="M685 315 L685 445 L720 445"/><path class="N" d="M665 385 L665 500 L720 500"/><path class="PE" d="M900 550 L900 590"/><rect x="1040" y="245" width="250" height="330" rx="16" class="device"/><text x="1165.0" y="281" class="label" text-anchor="middle">WALLBOX</text><text x="1165.0" y="310" class="small" text-anchor="middle">L / N / PE</text><text x="1165.0" y="334" class="small" text-anchor="middle">bornes do fabricante</text><path class="L" d="M950 315 L1040 315"/><path class="N" d="M950 385 L1040 385"/><path class="PE" d="M950 590 L1040 590"/><rect x="90" y="680" width="1200" height="55" rx="12" class="note"/><text x="110" y="710" class="small">1) L/N atravessam a proteção correspondente.  2) PE nunca atravessa o DR.  3) DPS é derivado dos condutores para o sistema de proteção conforme sua configuração.</text><rect x="55" y="730" width="1290" height="44" rx="12" class="warn"/><text x="75" y="758" class="small">⚠ Não misturar neutros de circuitos diferentes após o DR. Confirmar ligação do DPS conforme esquema TT/TN, polos e manual do fabricante.</text></svg>