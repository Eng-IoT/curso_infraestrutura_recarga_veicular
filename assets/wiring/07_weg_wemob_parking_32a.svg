</style><rect width="1400" height="820" fill="#ffffff"/><rect x="25" y="25" width="1350" height="770" rx="24" fill="#fff" stroke="#dbeafe" stroke-width="2"/><rect x="25" y="25" width="12" height="110" fill="#39ff14"/><text x="60" y="75" class="title">Esquema 07 — Estudo de caso WEG WEMOB PARKING 32 A</text><text x="60" y="110" class="sub">Proteções a montante conforme guia oficial WEG • diagrama didático, não cópia do manual</text><rect x="70" y="220" width="185" height="260" rx="16" class="device"/><text x="162.5" y="256" class="label" text-anchor="middle">ALIMENTAÇÃO</text><text x="162.5" y="285" class="small" text-anchor="middle">mono / bi / tri</text><text x="162.5" y="309" class="small" text-anchor="middle">conforme modelo</text><rect x="360" y="195" width="205" height="315" rx="16" class="device"/><text x="462.5" y="231" class="label" text-anchor="middle">DISJUNTOR</text><text x="462.5" y="260" class="small" text-anchor="middle">40 A curva C*</text><text x="462.5" y="284" class="small" text-anchor="middle">1P / 2P / 3P</text><rect x="660" y="195" width="205" height="315" rx="16" class="device"/><text x="762.5" y="231" class="label" text-anchor="middle">DR</text><text x="762.5" y="260" class="small" text-anchor="middle">40 A / 30 mA</text><text x="762.5" y="284" class="small" text-anchor="middle">Tipo A*</text><rect x="980" y="175" width="240" height="355" rx="16" class="device"/><text x="1100.0" y="211" class="label" text-anchor="middle">WEMOB PARKING</text><text x="1100.0" y="240" class="small" text-anchor="middle">ajuste 32 A</text><text x="1100.0" y="264" class="small" text-anchor="middle">entrada compatível</text><path class="L" d="M255 270 L360 270"/><path class="L" d="M565 270 L660 270"/><path class="L" d="M865 270 L980 270"/><text x="275" y="260" class="tiny">L1</text><path class="L2" d="M255 325 L360 325"/><path class="L2" d="M565 325 L660 325"/><path class="L2" d="M865 325 L980 325"/><text x="275" y="315" class="tiny">L2</text><path class="L3" d="M255 380 L360 380"/><path class="L3" d="M565 380 L660 380"/><path class="L3" d="M865 380 L980 380"/><text x="275" y="370" class="tiny">L3</text><path class="N" d="M255 435 L360 435"/><path class="N" d="M565 435 L660 435"/><path class="N" d="M865 435 L980 435"/><text x="275" y="425" class="tiny">N</text><path class="PE" d="M255 485 L980 485"/><text x="275" y="470" class="tiny">PE</text><rect x="95" y="585" width="1160" height="112" rx="16" class="note"/><text x="120" y="615" class="label">O que o guia WEG informa</text><text x="120" y="645" class="small">Para 32 A: disjuntor curva C 40 A e DR Tipo A 40 A / 30 mA; dispositivos compatíveis com instalação mono/bifásica/trifásica.</text><text x="120" y="675" class="tiny">O número de polos e os condutores efetivamente usados dependem da topologia da alimentação e do modelo da estação.</text><rect x="55" y="730" width="1290" height="44" rx="12" class="warn"/><text x="75" y="758" class="small">⚠ Fonte-base: guia oficial WEG WEMOB PARKING. Sempre consultar revisão vigente e dados do produto instalado.</text></svg>